name: Windows x64 build and release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      USE_HARD_LINKS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Activate Yarn 1.22.22
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Create reproducible development environment
        run: yarn setup

      - name: Test runtime resolution
        run: yarn test:jmcomic-runtime

      - name: TypeScript type check
        run: yarn typecheck

      - name: Build React application
        run: yarn build

      - name: Build PyInstaller onedir sidecar
        run: yarn build:jmcomic-sidecar

      - name: Test sidecar directly
        shell: pwsh
        run: |
          $sidecar = "dist-sidecar/jmcomic-bridge/jmcomic-bridge.exe"
          $result = & $sidecar check_env | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Sidecar check_env exited with $LASTEXITCODE" }
          if ($result.code -ne 0) { throw $result.msg }
          if ($result.data.jmcomic_version -ne "2.7.5") { throw "Unexpected JMComic version" }

      - name: Build and test unpacked Electron application
        shell: pwsh
        run: |
          yarn electron-builder --win --x64 --dir --publish never
          $sidecar = "dist/win-unpacked/resources/jmcomic-bridge/jmcomic-bridge.exe"
          if (-not (Test-Path $sidecar)) { throw "Packaged sidecar is missing" }
          $result = & $sidecar check_env | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.code -ne 0) { throw "Packaged sidecar self-check failed" }
          $nativeModule = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $nativeModule)) { throw "Packaged better-sqlite3 binding is missing" }
          $exe = "dist/win-unpacked/Koodo Reader Personal.exe"
          $env:ELECTRON_RUN_AS_NODE = $null
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Unpacked application exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Build NSIS and portable packages
        run: yarn electron-builder --win nsis portable --x64 --publish never

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "*.exe" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Koodo-Reader-Personal-${{ github.ref_name }}-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
