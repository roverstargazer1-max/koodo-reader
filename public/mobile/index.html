<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta id="theme-color-meta" name="theme-color" content="#121316">
  <title>Koodo Reader</title>
  <link rel="stylesheet" href="./app.css?v=20260904">
  <link rel="stylesheet" href="./comicReader.css?v=20260904">
  <link rel="stylesheet" href="./novelReader.css?v=20260904">
</head>
<body>
  <div id="app">
    <!-- Bookshelf View -->
    <div id="shelf-view">
      <header class="mobile-header">
        <div class="header-top">
          <div class="logo">
            <span class="logo-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
                <path d="M6 6h10"></path>
                <path d="M6 10h10"></path>
              </svg>
            </span>
            <span class="logo-text">Koodo Reader</span>
          </div>
          <div class="header-actions">
            <div id="connection-status" class="status-pill connected">
              <span class="status-dot"></span>
              <span class="status-text">局域网已连接</span>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="切换黑白主题" title="切换黑白主题">
              <svg class="theme-icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
              </svg>
              <svg class="theme-icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="搜索书名或作者..."
            autocomplete="off"
          />
          <button id="search-clear" class="search-clear" type="button" style="display: none;" aria-label="清空">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Category Filter Tabs -->
        <div class="filter-tabs-container">
          <nav class="filter-tabs" id="filter-tabs">
            <button class="filter-tab active" data-category="recent">最近阅读</button>
            <button class="filter-tab" data-category="all">全部</button>
            <button class="filter-tab" data-category="comic">漫画</button>
            <button class="filter-tab" data-category="novel">小说</button>
            <span class="filter-tab-divider" id="shelf-tab-divider" style="display: none;"></span>
          </nav>
          <button id="shelf-picker-btn" class="shelf-picker-btn" type="button" aria-label="书架分类" title="书架分类" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M6 6h10"></path>
              <path d="M6 10h10"></path>
            </svg>
            <span class="shelf-picker-text">书架</span>
            <svg class="shelf-picker-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Shelf Picker Bottom Sheet Modal -->
      <div id="shelf-modal-backdrop" class="shelf-modal-backdrop" style="display: none;">
        <div class="shelf-modal" id="shelf-modal">
          <div class="shelf-modal-header">
            <div class="shelf-modal-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
                <path d="M6 6h10"></path>
                <path d="M6 10h10"></path>
              </svg>
              <span>电脑端书架</span>
            </div>
            <button id="shelf-modal-close" class="shelf-modal-close" type="button" aria-label="关闭">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="shelf-modal-list" id="shelf-modal-list"></div>
        </div>
      </div>

      <main class="mobile-main">
        <!-- Loading State -->
        <div class="loading-container" id="shelf-loading">
          <div class="spinner"></div>
          <p>正在加载个人书库...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-container" id="shelf-empty" style="display: none;">
          <div class="empty-icon">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M4 6h16"></path>
              <path d="M10 2v20"></path>
            </svg>
          </div>
          <p class="empty-title">书架空空如也</p>
          <p class="empty-desc">未找到符合条件的图书</p>
        </div>

        <!-- Book Grid -->
        <div class="book-grid" id="book-grid" style="display: none;"></div>
      </main>
    </div>

    <!-- Comic Reader View (Loaded dynamically) -->
    <div id="comic-reader-view" class="reader-view" style="display: none;"></div>

    <!-- Novel Reader View (Loaded dynamically) -->
    <div id="novel-reader-view" class="reader-view" style="display: none;"></div>
  </div>

  <script src="./app.js?v=20260904"></script>
  <script src="./comicReader.js?v=20260904"></script>
  <script src="./novelReader.js?v=20260904"></script>
</body>
</html>
